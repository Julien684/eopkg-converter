<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fond : pastille sombre arrondie (style Solus) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a4a"/>
      <stop offset="1" stop-color="#141c24"/>
    </linearGradient>
    <linearGradient id="deb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba7d9"/>
      <stop offset="1" stop-color="#3d6ea5"/>
    </linearGradient>
    <linearGradient id="eop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd694"/>
      <stop offset="1" stop-color="#2f8f4e"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- Paquet source (gauche, bleu) : boîte 3D -->
  <g>
    <path d="M24 52 L48 40 L48 84 L24 96 Z" fill="#274b73"/>
    <path d="M48 40 L72 52 L48 64 Z" fill="url(#deb)"/>
    <path d="M24 52 L48 64 L48 84 L24 96 Z" fill="#4a7ab0"/>
  </g>

  <!-- Flèche de conversion (centre) -->
  <g fill="none" stroke="#f5c542" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 56 L96 56"/>
    <path d="M88 44 L100 56 L88 68"/>
  </g>

  <!-- Paquet cible (droite, vert) : boîte 3D -->
  <g>
    <path d="M100 56 L122 46 L122 88 L100 98 Z" fill="#1f6b39"/>
    <path d="M100 56 L78 47 L78 89 L100 98 Z" fill="#3fae63"/>
    <path d="M78 47 L100 56 L100 98 L78 89 Z" fill="url(#eop)"/>
  </g>

  <!-- Éclat au centre de l'icône pour équilibre -->
  <circle cx="64" cy="24" r="4" fill="#f5c542" opacity="0.9"/>
</svg>
